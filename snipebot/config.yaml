trading:
  mode: paper                    # 'paper' or 'live' — overridden by .env
  capital: 2000
  max_position_size: 200
  max_open_positions: 3
  max_daily_loss: 300

strategy:
  # ── Multi-Timeframe Stack (for 14–30 DTE options) ─────────────────────────
  # Weekly  → macro bias (must align before any entry is considered)
  # Daily   → market structure, order blocks, Fibonacci swing
  # 4-Hour  → intermediate OB confluence confirmation
  # 1-Hour  → entry trigger: liquidity sweep, RVOL, ATR
  weekly_lookback_weeks: 52      # Weekly bars for bias detection
  weekly_sma_period: 20          # SMA period for weekly trend confirmation
  daily_lookback_days: 60        # Daily bars for structure and OB detection
  h4_lookback_days: 30           # 4-hour bars for intermediate OB detection
  entry_timeframe: 1Hour         # Bar timeframe used for entry trigger
  scan_interval_minutes: 30      # How often the scanner runs

  # ── SMC Entry Filters ──────────────────────────────────────────────────────
  fib_zone_min: 0.618            # Lower Fibonacci retracement bound for entry
  fib_zone_max: 0.786            # Upper Fibonacci retracement bound for entry
  rvol_min: 1.5                  # Minimum relative volume (current / 20-bar avg on 1H)
  atr_expansion_min: 1.1         # Min fast-ATR / slow-ATR ratio (1H bars)
  session_score_min: 1           # Minimum session score (0=low, 1=medium, 2=high)
  ob_tolerance: 0.003            # Daily order block proximity tolerance (±0.3%)
  ob_4h_tolerance: 0.005         # 4H order block proximity tolerance (±0.5%)
  liquidity_zone_tolerance: 0.002 # Equal high/low detection tolerance (±0.2%)
  swing_lookback: 50             # Bars used for Fibonacci swing detection
  struct_swing_order: 3          # argrelextrema neighbourhood for daily swing points

  # ── Near-miss tracking ────────────────────────────────────────────────────
  near_miss_discord_threshold: 9  # Send Discord alert when >= N of 12 conditions pass but trade doesn't fire

  # ── Universal Filters (unchanged) ─────────────────────────────────────────
  vix_max: 30                    # Skip when VIX >= this value
  min_dte: 14                    # Minimum days to expiration
  max_dte: 30                    # Maximum days to expiration
  ai_confidence_min: 0.72        # AI model minimum confidence to fire
  earnings_buffer_days: 5        # Skip if earnings within this many days

  # ── Exit Parameters ────────────────────────────────────────────────────────
  take_profit_pct: 0.40          # +40% on option premium
  stop_loss_pct: 0.25            # −25% on option premium
  trail_trigger_pct: 0.20        # Start trailing once +20% reached
  trail_stop_pct: 0.10           # Trail stops −10% from peak

ml:
  cold_start_trades: 50          # Use rule-based scorer until this many trades logged
  retrain_day: sunday
  min_trades_for_learning: 20    # Minimum trades before learning adjustments apply
  model_path: models/confidence_model.pkl

watchlist:
  - GOOGL
  - MSFT
  - TSLA
  - AAPL
  - SPY

notifications:
  daily_report_time: "16:15"
  timezone: US/Eastern
