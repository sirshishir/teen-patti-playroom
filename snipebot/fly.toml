# fly.toml — SnipeBot deployment config for Fly.io
#
# SnipeBot is a BACKGROUND WORKER — it has no HTTP server and exposes no ports.
# There is intentionally NO [http_service], NO [[services]], and NO [processes]
# section: Fly runs the Dockerfile's CMD ("python main.py") as the single
# default process. Adding an [http_service] makes Fly health-check a port the
# app never opens ("instance refused connection ... 0.0.0.0:8080") and restart
# the machine in a loop.
#
# NOTE: `fly launch` / Fly's GitHub integration will try to regenerate this
# file and re-add an [http_service]. Always deploy with the committed config.
#
# TWO PROCESSES → TWO MACHINES from one image (one deploy):
#   snipebot  = the options paper-trading bot   → #price-alert, snipebot.db
#   daytrader = the day-trade alerts bot        → #day-trade,  daytrader.db
# Each machine mounts its OWN volume at /data (Fly volumes attach to a single
# machine — they cannot be shared). Create BOTH volumes before first deploy:
#   snipebot_data   (may already exist)
#   daytrader_data
# Neither process opens a port, so there is intentionally NO [http_service].

# ── App identity ──────────────────────────────────────────────────────────────
app = 'teen-patti-playroom'
primary_region = 'ord'

# ── Build ─────────────────────────────────────────────────────────────────────
[build]

# ── Runtime environment variables ─────────────────────────────────────────────
# Non-secret config only. Secrets (API keys, Discord token/webhooks) are set in
# the Fly dashboard → Secrets (or `fly secrets set KEY=value`).
[env]
  PYTHONUNBUFFERED = '1'
  SNIPEBOT_DATA_DIR = '/data'

# ── Processes ──────────────────────────────────────────────────────────────────
[processes]
  snipebot = 'python main.py'
  daytrader = 'python -m daytrader.main'

# ── Persistent volumes (one per machine) ───────────────────────────────────────
# snipebot.db + logs/ live here for the snipebot machine.
[[mounts]]
  source = 'snipebot_data'
  destination = '/data'
  processes = ['snipebot']

# daytrader.db (calibration/training) lives here for the daytrader machine.
[[mounts]]
  source = 'daytrader_data'
  destination = '/data'
  processes = ['daytrader']

# ── VM sizing (applies to both process machines) ───────────────────────────────
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
